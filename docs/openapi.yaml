openapi: 3.0.3
info:
  title: Email Gateway API
  description: API untuk mengirim, menjadwalkan, dan menerima event email (SendGrid) — generated from project routes.
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /api/v1/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation error
  /api/v1/auth/login:
    post:
      summary: Login with email and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Auth tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
  /api/v1/auth/refresh-token:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Unauthorized
  /api/v1/auth/logout:
    post:
      summary: Logout (invalidate refresh token)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: No Content

  /api/v1/email:
    post:
      summary: Send an email
      tags: [Email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
      responses:
        '200':
          description: Send result
          content:
            application/json:
              schema:
                type: object
                description: Provider response or info
  /api/v1/email/status:
    post:
      summary: Check email status by id
      tags: [Email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mailId:
                  type: string
      responses:
        '200':
          description: Status result
  /api/v1/email/schedule:
    post:
      summary: Schedule an email to be sent later
      tags: [Email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
      responses:
        '201':
          description: Scheduled job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledJob'
  /api/v1/email/bulk:
    post:
      summary: Send bulk emails
      tags: [Email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Email'
      responses:
        '200':
          description: Array of results per recipient
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BulkResult'
  /api/v1/email/sendgrid:
    post:
      summary: Send email via SendGrid
      tags: [Email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Email'
      responses:
        '200':
          description: SendGrid response
  /api/v1/email/events-sendgrid:
    post:
      summary: Receive SendGrid event webhook
      tags: [Email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SendGridEvent'
      responses:
        '200':
          description: Events processed
  /api/v1/email/webhook-sendgrid:
    post:
      summary: Register SendGrid webhook via API
      tags: [Email]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookConfig'
      responses:
        '200':
          description: Registration result
  /api/v1/email/webhook-info:
    get:
      summary: Get webhook information and setup instructions
      tags: [Email]
      responses:
        '200':
          description: Webhook info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookInfo'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        name:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    TokenResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
    Email:
      type: object
      required: [to]
      properties:
        name:
          type: string
        to:
          type: string
          format: email
        subject:
          type: string
        text:
          type: string
        html:
          type: string
    ScheduleRequest:
      type: object
      required: [to, sendAt]
      properties:
        name:
          type: string
        to:
          type: string
        subject:
          type: string
        text:
          type: string
        sendAt:
          type: string
          description: "Component list format: 'YYYY,MM,DD,HH,mm,ss'"
    ScheduledJob:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        to:
          type: string
        subject:
          type: string
        text:
          type: string
        sendAt:
          type: string
        status:
          type: string
    BulkResult:
      type: object
      properties:
        to:
          type: string
        success:
          type: boolean
        info:
          type: object
        error:
          type: string
    SendGridEvent:
      type: object
      description: sendgrid webhook event (partial schema)
      properties:
        email:
          type: string
        event:
          type: string
        sg_message_id:
          type: string
        timestamp:
          type: integer
    WebhookConfig:
      type: object
      required: [webhookUrl]
      properties:
        webhookUrl:
          type: string
          format: uri
        friendlyName:
          type: string
    WebhookInfo:
      type: object
      properties:
        message:
          type: string
        endpoints:
          type: object
        supported_events:
          type: array
          items:
            type: string
        setup_instructions:
          type: array
          items:
            type: string

tags:
  - name: Auth
  - name: Email
